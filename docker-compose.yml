name: lessonlab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lessonlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessonlab}
      POSTGRES_DB: ${POSTGRES_DB:-lessonlab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lessonlab} -d ${POSTGRES_DB:-lessonlab}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
    image: lessonlab-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lessonlab}:${POSTGRES_PASSWORD:-lessonlab}@postgres:5432/${POSTGRES_DB:-lessonlab}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /data
    ports:
      - "3100:3000"
    volumes:
      - media:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    image: lessonlab-worker:latest
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lessonlab}:${POSTGRES_PASSWORD:-lessonlab}@postgres:5432/${POSTGRES_DB:-lessonlab}?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /data
    volumes:
      - media:/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  media:
